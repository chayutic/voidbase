<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Notes — Voidbase</title>

  <!-- Applies the saved theme and note font before first paint. Must stay inline and
       blocking: a deferred module runs after the default palette is
       already on screen. -->
  <script>
    {
      const root = document.documentElement;
      root.dataset.theme = "violet";
      try {
        root.dataset.theme = localStorage.getItem("theme") || "violet";
        if (localStorage.getItem("notesFont") === "mono") root.classList.add("notes-mono");
      } catch (e) {}
    }
  </script>

  <!-- View transition opt-in. Must stay inline and precede every
       external stylesheet: the incoming document has to be opted in
       before the browser decides whether to run the transition. -->
  <style>@view-transition { navigation: auto; }</style>



  <!-- Preloaded because self-hosting otherwise costs a three-hop chain:
       HTML, then fonts.css, then the face. These are the latin subsets
       every visible string uses; the rest stay demand-loaded. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/js/vendor/fonts/v5_gyByhwUxId8gMEwcGFU.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/js/vendor/fonts/v34_Qw3PZQNVED7rKGKxtqIqX5E-AVSJrOCfjY46_N_XbMZhLw.woff2">
  <link rel="preload" as="font" type="font/woff2" crossorigin href="/js/vendor/fonts/v29_iJWQBXeUZi_OHPqn4wq6hQ2_hbJ1xyN9wd43SofNWcdfKI2hX2g.woff2">

  <link rel="stylesheet" href="/js/vendor/fonts.css">

  <!-- style.css is deliberately not loaded: this page has its own
       typography, and no dashboard component exists here. -->
  <link rel="stylesheet" href="/theme.css" />
  <link rel="stylesheet" href="/settings.css" />
  <link rel="stylesheet" href="/notes.css" />

  <!-- The whole import graph of js/notes/main.js, dynamic imports
       included, so every module is requested at once instead of one
       import level per round trip. Kept equal to the graph by
       `npm run lint:conventions`. -->
  <link rel="modulepreload" href="/js/theme.js">
  <link rel="modulepreload" href="/js/settings.js">
  <link rel="modulepreload" href="/js/notes/library.js">
  <link rel="modulepreload" href="/js/notes/tabs.js">
  <link rel="modulepreload" href="/js/notes/switcher.js">
  <link rel="modulepreload" href="/js/notes/band.js">
  <link rel="modulepreload" href="/js/notes/editor.js">
  <link rel="modulepreload" href="/js/notes/move.js">
  <link rel="modulepreload" href="/js/notes/font.js">
  <link rel="modulepreload" href="/js/store.js">
  <link rel="modulepreload" href="/js/config.js">
  <link rel="modulepreload" href="/js/notes/api.js">
  <link rel="modulepreload" href="/js/notes/format.js">
  <link rel="modulepreload" href="/js/icons.js">
  <link rel="modulepreload" href="/js/inline-edit.js">
  <link rel="modulepreload" href="/js/notes/preview.js">
  <link rel="modulepreload" href="/js/notes/markdown.js">
  <link rel="modulepreload" href="/js/vendor/marked.esm.js">
  <link rel="modulepreload" href="/js/vendor/cm6.min.js">
  <link rel="modulepreload" href="/js/notes/livepreview.js">
  <link rel="modulepreload" href="/js/notes/commands.js">
</head>

<body class="notes">

  <main class="notes__stage">

    <nav class="notes__tabs" aria-label="Pinned notes">
      <div class="notes__tab-strip" id="noteTabs"></div>

      <div class="notes__tabs-rest">
        <button class="notes__icon-btn" id="noteNew" type="button" aria-label="New note" title="New note">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
        <button class="notes__switch" id="switcherOpen" type="button" aria-keyshortcuts="Control+K">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
          </svg>
          <span>All notes</span>
          <kbd class="notes__kbd">Ctrl K</kbd>
        </button>
      </div>
    </nav>

    <section class="notes__pane">

      <!-- Three surfaces, one slot, exactly one visible: CodeMirror once
           it mounts, a read-only marked render until then, the textarea
           if it never loads. -->
      <div class="notes__editor" id="noteEditor"></div>

      <article class="notes__preview markdown" id="notePreview"></article>

      <textarea class="notes__fallback"
                id="noteFallback"
                spellcheck="false"
                autocomplete="off"
                placeholder="Start typing. A first line like “# Groceries” becomes the title."></textarea>

      <div class="notes__statusbar">
        <span class="notes__status" id="noteStatus"><span id="noteStatusText"></span></span>

        <button class="notes__note-folder" id="noteFolder" type="button"
                popovertarget="folderPicker" title="Move to another folder" hidden></button>
        <div class="notes__picker" id="folderPicker" popover aria-label="Move to folder">
          <div class="notes__picker-label">Move to</div>
          <div class="notes__picker-list" id="folderPickerList"></div>
          <label class="notes__picker-new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
            </svg>
            <input id="folderPickerNew" type="text" placeholder="New folder" aria-label="New folder"
                   maxlength="64" autocomplete="off" spellcheck="false">
          </label>
        </div>

        <span class="notes__meta" id="noteMeta"></span>

        <span class="notes__move-hint" id="noteMoveHint" hidden>Move tab <kbd class="notes__kbd">Alt ← →</kbd></span>

        <button class="notes__font" id="noteFont" type="button"></button>

        <button class="notes__icon-btn notes__pin" id="notePin" type="button" aria-label="Pin" aria-pressed="false" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/>
          </svg>
        </button>
        <button class="notes__icon-btn notes__delete" id="noteDelete" type="button" aria-label="Delete note" title="Delete note" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </section>

  </main>


  <!-- ════ SWITCHER ════ -->
  <dialog class="notes__switcher" id="noteSwitcher" aria-label="All notes">
    <div class="notes__switcher-box">
      <label class="notes__searchbar">
        <svg class="notes__search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="22" y2="22"/>
        </svg>
        <input class="notes__search" id="notesSearch" aria-label="Search notes" type="text"
               placeholder="Search notes…" autocomplete="off" spellcheck="false">
      </label>

      <div class="notes__folders" id="notesFolders" role="group" aria-label="Folders" hidden></div>

      <div class="notes__list" id="notesList"></div>
    </div>
  </dialog>


  <!-- ════ DASHBOARD BUTTON ════
       Its twin sits in the same corner on the dashboard, pointing back
       here — same markup, same styles. -->
  <a class="nav-trigger" href="/" aria-label="Go to dashboard">
    <!-- 1.5 on 24, not the gear's 1.75 — deliberately mismatched. Axis-
         aligned rects hit the pixel grid at full coverage where the
         gear's teeth do not, so equal stroke-widths look unequal. The
         dashboard's nav icon is correct at its own value; do not "fix"
         either to match the other. -->
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="3" width="7" height="7" rx="1"/>
      <rect x="14" y="14" width="7" height="7" rx="1"/>
      <rect x="3" y="14" width="7" height="7" rx="1"/>
    </svg>
  </a>


  <!-- ════ SETTINGS BUTTON ════ -->
  <button class="settings-trigger" id="settingsTrigger" aria-label="Open settings">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>


  <!-- ════ SETTINGS PANEL ════
       Same markup and same ids as the dashboard, so settings.js and
       theme.js drive it unchanged. The Layout Customizer row is
       omitted: it reorders dashboard sections that do not exist here.
       Dashboard-only widgets still persist from this page. -->
  <div class="settings-panel" id="settingsPanel">

    <div class="settings-panel__header">Control Panel</div>

    <div class="settings__section">
      <div class="settings__section-label">Theme</div>
      <div class="swatch-row">
        <button class="theme__swatch" data-theme="violet" aria-label="Violet"></button>
        <button class="theme__swatch" data-theme="blue"   aria-label="Blue"></button>
        <button class="theme__swatch" data-theme="pink"   aria-label="Pink"></button>
        <button class="theme__swatch" data-theme="green"  aria-label="Green"></button>
        <button class="theme__swatch" data-theme="black"  aria-label="Black"></button>
        <button class="theme__swatch" data-theme="white"  aria-label="White"></button>
        <span class="swatch-name" id="swatchName"></span>
      </div>
    </div>

    <div class="settings__section">
      <div class="settings__section-label">Display</div>

      <div class="settings__row">
        <span>Status Info</span>
        <label class="settings__toggle">
          <input type="checkbox" id="statusInfoToggle" aria-label="Status Info" checked>
          <span class="settings__toggle-track"></span>
        </label>
      </div>

      <div class="settings__row">
        <span>Guest Mode</span>
        <label class="settings__toggle">
          <input type="checkbox" id="guestModeToggle" aria-label="Guest Mode">
          <span class="settings__toggle-track"></span>
        </label>
      </div>

    </div>

    <div class="settings__section">
      <div class="settings__section-label">Widgets</div>

      <!-- Force 90D Low column on small screens -->
      <div class="settings__row">
        <span>Force 90D Low</span>
        <label class="settings__toggle">
          <input type="checkbox" id="force90dToggle" aria-label="Force 90D Low">
          <span class="settings__toggle-track"></span>
        </label>
      </div>

      <div class="settings__row">
        <span>Expanded Charts</span>
        <label class="settings__toggle">
          <input type="checkbox" id="expandedChartsToggle" aria-label="Expanded Charts">
          <span class="settings__toggle-track"></span>
        </label>
      </div>

      <div class="settings__row">
        <span>Ticker Count</span>
        <div class="settings__stepper">
          <button id="tickerMinus" aria-label="Fewer tickers">−</button>
          <span id="tickerCount">6</span>
          <button id="tickerPlus" aria-label="More tickers">+</button>
        </div>
      </div>

      <div class="placeholder-row">Nuclear launch<span class="placeholder-pill">soon</span></div>
    </div>

    <div class="settings__version" id="settingsVersion"></div>

  </div>

  <script type="module" src="/js/notes/main.js"></script>

</body>
</html>
